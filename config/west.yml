manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # DYA Studio 独自機能（runtime input processor / settings rpc）は cormoran 独自の
    # Studio RPC プロトコル拡張を使うため、公式 zmk ではなく cormoran のフォークを使用。
    # v0.3-branch+dya は dya-dash 実機が使う統合ブランチで、zephyr ベースは
    # zmkfirmware/v3.5.0+zmk-fixes（公式 v0.3 と同一）。違いは独自 zmk-studio-messages のみ。
    # NOTE: cormoran/zmk 本体は v0.3 系で zmk_keymap_layer_activate は1引数。
    # 一方 runtime-input-processor の main は e643dfe(2026-04-30 "Migrate to zmk v4")で
    # この呼び出しを2引数化しており、本体と API 不整合(too many arguments)を起こして
    # central 構成のビルドが壊れる。本体(v0.3)と整合する v4 移行前(dbf92f7, 2026-02-24)に固定。
    # ブランチ追従だと再発するため、zmk / settings-rpc も再現性のため SHA 固定する。
    - name: zmk
      remote: cormoran
      revision: 4493783ef88ce2e653bf8217c92ee17140df71e3
      import: app/west.yml
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: dbf92f764de8
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: ad1c995cf910ca989ecd6352a1d0b41ccb18362c
    - name: zmk-component-bmp-boost
      remote: sekigon-gonnoc
      import: west.yml
      revision: v0.2
    - name: zmk-feature-status-led
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: torabo-tsuki
    - name: zmk-driver-iqs7211e
      remote: sekigon-gonnoc
    - name: zmk-feature-cdc-acm-bootloader-trigger
      remote: sekigon-gonnoc
      revision: v0.2
    - name: zmk-feature-non-lipo-battery-management
      remote: sekigon-gonnoc
      revision: main
  self:
    path: config
