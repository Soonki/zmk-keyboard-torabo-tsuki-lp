CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --- DYA Studio 独自機能は central(PCに繋がる側)専用 ---
# peripheral では USB Studio が無効で nanopb 環境が無いため、proto(pb.h)が解決できずビルドが壊れる。
# DYA Studio は central に接続するので、これらは central だけで有効化する。
# トラックボール実機調整 (runtime input processor)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
# スリープ/アイドル設定の実機調整 (settings rpc)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
